<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ace the Exam项目封面</title>
  <desc id="desc">基于Ace the Exam官网和考试平台设计稿重组的项目封面。</desc>
  <rect width="1200" height="900" fill="#050506"/>
  <path d="M0 0H1200V900H0V0Z" fill="url(#bg)"/>
  <path d="M96 210C282 106 458 136 626 222C802 312 974 292 1116 192" stroke="#9b8cff" stroke-width="2" stroke-opacity=".38"/>
  <g filter="url(#shadow)">
    <rect x="120" y="146" width="520" height="352" rx="24" fill="#111114"/>
    <image href="ace-exam/landing-main.png" x="142" y="168" width="476" height="308" preserveAspectRatio="xMidYMin slice" clip-path="url(#webA)"/>
    <rect x="142" y="168" width="476" height="308" rx="16" stroke="#ffffff" stroke-opacity=".12"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(-3 694 514)">
    <rect x="438" y="360" width="560" height="364" rx="26" fill="#111114"/>
    <image href="ace-exam/test-dashboard.png" x="462" y="384" width="512" height="333" preserveAspectRatio="xMidYMid slice" clip-path="url(#webB)"/>
    <rect x="462" y="384" width="512" height="333" rx="18" stroke="#9b8cff" stroke-opacity=".5"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="122" width="318" height="206" rx="22" fill="#111114"/>
    <image href="ace-exam/test-single-best-answer.png" x="778" y="140" width="282" height="183" preserveAspectRatio="xMidYMid slice" clip-path="url(#webC)"/>
  </g>
  <rect x="72" y="70" width="238" height="42" rx="21" fill="#9b8cff" fill-opacity=".16" stroke="#9b8cff" stroke-opacity=".44"/>
  <text x="96" y="98" fill="#d7d1ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">2024 / MEDICAL EDTECH</text>
  <text x="72" y="812" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800">Ace the Exam</text>
  <text x="76" y="856" fill="#d7d1ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Landing page · Test platform · Learning analytics</text>
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="900">
      <stop stop-color="#181326"/>
      <stop offset=".48" stop-color="#050506"/>
      <stop offset="1" stop-color="#101d1a"/>
    </linearGradient>
    <clipPath id="webA"><rect x="142" y="168" width="476" height="308" rx="16"/></clipPath>
    <clipPath id="webB"><rect x="462" y="384" width="512" height="333" rx="18"/></clipPath>
    <clipPath id="webC"><rect x="778" y="140" width="282" height="183" rx="14"/></clipPath>
    <filter id="shadow" x="60" y="70" width="1080" height="720" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
</svg>
