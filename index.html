.loading-print:before{content:'';display:block;height:100%;background:var(--color)}
.loading-print:after{content:'';position:absolute;left:36px;top:-5px;width:12px;height:12px;border-radius:50%;background:#4164bd;box-shadow:inset 2px 2px 2px #ffffff70,1px 3px 2px #1c326755}
@keyframes pin-arrive{0%,100%{transform:translateY(0) rotate(var(--tilt))}45%{transform:translateY(-9px) rotate(calc(var(--tilt) + 3deg))}}
@media(prefers-reduced-motion:reduce){.loading-print{animation:none}#board-loading{transition:none}}
</style>
